<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Booker Hub · Lucha Libre</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>:root{--bg:#0b0b10;--card:#15151d;--line:#262633;--tx:#f2f2f5;--mu:#8b8b9c;--ac:#e11d2e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
.h{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.05em}.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.inp{background:#0e0e14;border:1px solid var(--line);border-radius:10px;padding:.45rem .7rem;width:100%;color:var(--tx)}
.btn{background:var(--ac);border-radius:10px;padding:.45rem .9rem;font-weight:600}.btn2{background:#23232f;border-radius:10px;padding:.45rem .9rem}
.bd{font-size:.7rem;padding:2px 8px;border-radius:99px;background:#23232f}</style></head>
<body>
<header class="sticky top-0 z-40 bg-[var(--bg)]/95 backdrop-blur border-b border-[var(--line)]">
<div class="max-w-6xl mx-auto px-3 pt-2"><div class="flex items-center gap-2"><svg width="30" height="30" viewBox="0 0 24 24" fill="#e11d2e"><path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg><h1 class="h text-3xl">BOOKER <span class="text-[var(--ac)]">HUB</span></h1><span class="ml-auto flex gap-1"><button class="btn2 text-xs" onclick="expo()">⬇ Exportar</button><label class="btn2 text-xs cursor-pointer">⬆ Importar<input type="file" accept=".json" class="hidden" onchange="impo(this)"></label></span></div>
<nav id="nav" class="flex gap-1 overflow-x-auto py-2"></nav></div></header>
<main id="app" class="max-w-6xl mx-auto p-3 pb-16 overflow-x-clip"></main>
<div id="res" class="hidden fixed inset-0 z-50 bg-black/80 items-center justify-center p-4" onclick="this.classList.add('hidden')"><div class="card p-8 text-center max-w-sm border-[var(--ac)]"><div class="text-5xl mb-2">🎯</div><p class="text-[var(--mu)]">La ruleta ha seleccionado</p><p id="rt" class="h text-4xl mt-1"></p></div></div>
<script>
const K='bookerhub_v1';let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{brands:[{id:'b1',name:'RAW',color:'#e11d2e'},{id:'b2',name:'SmackDown',color:'#2563eb'},{id:'b3',name:'ECW',color:'#a855f7'}],wr:[],tags:[],titles:[],ppv:['WrestleMania','Royal Rumble','SummerSlam','Survivor Series','Money in the Bank','Elimination Chamber']};
S.ev=S.ev||[];S.log=S.log||[];S.cru=S.cru||{st:{},title:''};S.cups=S.cups||[];S.chat=S.chat||[];S.p5=S.p5||[];
const srt=()=>{const f=(a,b)=>String(a.name||'').localeCompare(String(b.name||''),'es',{sensitivity:'base'});S.wr.sort(f);S.tags.sort(f)};
const save=()=>{srt();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Almacenamiento lleno: usá imágenes más chicas o borrá datos.')}};
const uid=()=>Math.random().toString(36).slice(2,9),$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const col=id=>S.brands.find(b=>b.id==id)?.color||'#555',bname=id=>S.brands.find(b=>b.id==id)?.name||'Free agent';
/* ---------- ROSTER INICIAL (se carga una sola vez; no pisa lo que ya tengas) ---------- */
if(!S.seeded){
const D={SmackDown:'#2563eb',RAW:'#e11d2e',NXT:'#eab308',ECW:'#a855f7',WCW:'#94a3b8',AEW:'#10b981',ROH:'#f97316',Impact:'#06b6d4'};
const L={
SmackDown:`Adam Cole;Angel Garza;Austin Aries;Baron Corbin;Big Cass;Bubba Ray Dudley;Cody Rhodes;D-Von Dudley;Damian Priest;Eddie Guerrero;Enzo Amore;Humberto Carrillo;Kevin Owens;Kevin Von Erich;Kerry Von Erich;Mankind;Mr McMahon;Papa Shango;Rusev;Samoa Joe;Seth Rollins;Sycho Sid;The Rock;Vicente Viloni`,
RAW:`Aiden English;Albert;Bray Wyatt;Buddy Roberts;Butch;Christian;Dean Ambrose;Dexter Lumis;Erik Rowan;Gorilla King (Max Fury);Johnny Gargano;Karrion Kross;Luke;Luke Harper;Mark Henry;Michael Hayes;Místico;Simon Gotch;Titus O'Neil;Tommaso Ciampa;Triple H;Tye Dillinger;Wade Barrett`,
NXT:`Alberto Del Rio;Adam Page;Apolo Crews;Batista;Big Boss Man;Braun Strowman;British Bulldog;Chad Gable;Chris Jericho;Dominik Mysterio;Dragon Lee;Dusty Rhodes;Goldberg;Goldust;Hulk Hogan;JBL;Jason Jordan;John Cena;Matt Riddle;Mojo Rawley;Rey Mysterio;Tyson Kidd;Veer Mahaan;Zack Ryder`,
ECW:`Bam Bam Bigelow;Big E;Bo Dallas;Bobby Lashley;Brett Hart;CM Punk;Cactus Jack;Curtis Axel;Edge;Heat Slater;Jake Roberts;Kofi Kingston;Lex Luger;R-Truth;Rikishi;Sabu;Sandman;Sin Cara;Shane McMahon;Shinsuke Nakamura;Tatsumi Fujinami;Taz;Terry Funk;Tommy Dreamer`,
WCW:`Austin Theory;Booker T;Bryan Pillman;Brock Lesnar;Cesaro;Darren Young;DDP;Fandango;Giovanni Vinci;Gunther;Kalisto;Karl Anderson;Kevin Nash;La Parka;Ludwig Kaiser;Luke Gallows;MVP;Malakai Black;Road Dogg;Rob Van Dam;Scott Hall;Tatanka;The Godfather;Tyler Breeze`,
AEW:`Big Show;Billy Gunn;Chris Benoit;Darby Allin;Diego;Dralistico;Drew McIntyre;Earthquake;Fernando;Hook;Jey Uso;Jim Neidhart;Jimmy Uso;Konnor;Larry Zbyszko;Luchasaurus;Penta Zero Miedo;Roman Reigns;The Miz;Typhoon;Umaga;Viktor;X-Pac;Xavier Woods`,
ROH:`AJ Styles;André The Giant;Brutus Beefcake;Daniel Bryan;Dolph Ziggler;Dude Love;Greg Valentine;Jacob Fatu;Jeff Hardy;Jimmy Garvin;Kane;Kurt Angle;Matt Hardy;Mr Perfect;Neville;Randy Orton;Sami Zayn;Shawn Michaels;Stone Cold;Tama Tonga;Tonga Loa;Ultimate Warrior;Undertaker;Vader`,
Impact:`Andrade Cien Almas;Arn Anderson;Blake;Damien Sandow;Dash Wilder;Evan Bourne;Finn Balor;Gorilla Grood (Leon Strife);Gorilla Kang (Aiden Nightfall);Hideo Itami;Jack Swagger;Justin Gabriel;LA Knight;Murphy;Onix;Randy Savage;Ric Flair;Ric Rude;Ricky Steamboat;Scott Dawson;Sheamus;Sting;Tajiri`};
const CR=new Set(['Místico','Dragon Lee','Penta Zero Miedo','Dralistico','Kalisto','La Parka','Sin Cara','Tajiri','Rey Mysterio','Evan Bourne','Justin Gabriel','Austin Aries','Angel Garza','Humberto Carrillo','Andrade Cien Almas']);
Object.entries(L).forEach(([bn,names])=>{let b=S.brands.find(x=>x.name.toLowerCase()==bn.toLowerCase());if(!b){b={id:uid(),name:bn,color:D[bn]};S.brands.push(b)}
 names.split(';').forEach(n=>{n=n.trim();if(n&&!S.wr.some(w=>w.name.toLowerCase()==n.toLowerCase()))S.wr.push({id:uid(),name:n,fin:'',nat:'',brand:b.id,al:'Tweener',w:CR.has(n)?'Cruiserweight':'Heavyweight',pop:50,bio:'',img:''})})});
S.seeded=1;save()}
const imgOf=n=>'img/'+n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/['’]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.png';
const T=[['roster','ROSTER Y FACCIONES',1],['titles','CAMPEONATOS',1],['wheel','RULETA',1],['cruiser','DIVISIÓN CRUSERO',1],['book','MESA DE BOOKING',1],['log','BITÁCORA',1],['cup','TORNEO MUNDIAL',1],['p500','POWER 500',1],['ai','BOOKER AI',1]];
let tab='roster',F={q:'',brand:'',al:'',w:'',team:'',letter:'',champ:false};
const go=t=>{tab=t;render()};
function render(){$('#nav').innerHTML=T.map(t=>`<button onclick="go('${t[0]}')" class="h whitespace-nowrap px-3 py-1.5 rounded-lg text-lg ${tab==t[0]?'bg-[var(--ac)]':'text-[var(--mu)]'}">${t[1]}${t[2]?'':' 🔒'}</button>`).join('');
 if(tab=='roster')roster();else if(tab=='titles')titles();else if(tab=='wheel')wheel();else if(tab=='book')book();else if(tab=='log')logv();else if(tab=='cruiser')cruiser();else if(tab=='cup')cups();else if(tab=='p500')pw();else if(tab=='ai')ai();
 else $('#app').innerHTML=`<div class="card p-10 text-center"><div class="text-5xl mb-3">🚧</div><h2 class="h text-3xl">${T.find(t=>t[0]==tab)[1]}</h2><p class="text-[var(--mu)] mt-2">Llega en la próxima fase.</p></div>`}
/* ---------- formularios ---------- */
const inp=(f,x)=>{const a=`name="${f.k}" class="inp mt-1 text-sm"`;
 if(f.t=='sel')return`<select ${a}>${f.o.map(o=>`<option value="${o[0]}" ${o[0]==x?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
 if(f.t=='multi')return`<div class="flex gap-1 mt-1"><input class="inp text-sm" placeholder="🔎 Filtrar por nombre…" oninput="flt(this)">${f.o.some(o=>o[2]!==undefined)?`<select class="inp text-sm" style="width:42%" onchange="flt(this)"><option value="">Marca</option>${S.brands.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select>`:''}</div><select ${a} multiple size="6" onmousedown="tg(event)">${f.o.map(o=>`<option value="${o[0]}" data-b="${o[2]??''}" ${(x||[]).includes(o[0])?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
 if(f.t=='area')return`<textarea ${a} rows="3">${esc(x)}</textarea>`;
 if(f.t=='file')return`<input type="file" accept="image/*" ${a}>`;
 return`<input type="${f.t||'text'}" ${a} value="${esc(x??(f.t=='color'?'#e11d2e':''))}" ${f.t=='range'?'min=1 max=100':''}>`};
const img=file=>new Promise(r=>{const fr=new FileReader;fr.onload=()=>{const i=new Image;i.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,200/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=fr.result};fr.readAsDataURL(file)});
function form(title,fields,v,ok){v=v||{};const m=document.createElement('div');m.className='fixed inset-0 z-50 bg-black/70 flex items-end sm:items-center justify-center p-3';
 m.innerHTML=`<div class="card w-full max-w-md max-h-[90vh] overflow-auto p-5 space-y-3"><h3 class="h text-2xl">${title}</h3>${fields.map(f=>`<label class="block text-xs text-[var(--mu)]">${f.l}${inp(f,v[f.k])}</label>`).join('')}<div class="flex gap-2 justify-end pt-2"><button class="btn2" id="fx">Cancelar</button><button class="btn" id="fo">Guardar</button></div></div>`;
 document.body.appendChild(m);m.querySelector('#fx').onclick=()=>m.remove();
 m.querySelector('#fo').onclick=async()=>{const o={};for(const f of fields){const e=m.querySelector(`[name=${f.k}]`);o[f.k]=f.t=='file'?(e.files[0]?await img(e.files[0]):v[f.k]):f.t=='multi'?(e._s?[...e._s]:[...e.selectedOptions].map(x=>x.value)):f.t=='range'?+e.value:e.value}
  if(!String(o[fields[0].k]||'').trim())return alert('Completá el primer campo');const er=ok(o);if(typeof er=='string')return toast(er);save();m.remove();render()}}
/* ---------- ROSTER ---------- */
const bopt=()=>[['','Free agent'],...S.brands.map(b=>[b.id,b.name])];
function brForm(id){const b=S.brands.find(x=>x.id==id);form(b?'Editar marca':'Nueva marca',[{k:'name',l:'Nombre'},{k:'color',l:'Color identificativo',t:'color'}],b,o=>b?Object.assign(b,o):S.brands.push({id:uid(),...o}))}
function brDel(id){if(!confirm('¿Borrar marca?'))return;S.brands=S.brands.filter(b=>b.id!=id);[...S.wr,...S.tags,...S.titles].forEach(x=>{if(x.brand==id)x.brand=''});save();render()}
function wrForm(id){const w=S.wr.find(x=>x.id==id);form(w?'Editar luchador':'Nuevo luchador',[{k:'name',l:'Nombre'},{k:'fin',l:'Finisher'},{k:'nat',l:'Nacionalidad'},{k:'brand',l:'Marca',t:'sel',o:bopt()},{k:'al',l:'Alineación',t:'sel',o:['Babyface','Heel','Tweener'].map(x=>[x,x])},{k:'w',l:'Peso',t:'sel',o:['Heavyweight','Cruiserweight'].map(x=>[x,x])},{k:'pop',l:'Popularidad (1-100)',t:'range'},{k:'bio',l:'Biografía',t:'area'},{k:'img',l:'Imagen',t:'file'}],w||{pop:50},o=>w?Object.assign(w,o):S.wr.push({id:uid(),...o}))}
function wrDel(id){if(!confirm('¿Borrar luchador?'))return;S.wr=S.wr.filter(w=>w.id!=id);S.tags.forEach(t=>t.m=t.m.filter(x=>x!=id));S.titles.forEach(t=>{if(t.champ==id)t.champ=''});save();render()}
function tgForm(id){const t=S.tags.find(x=>x.id==id);form(t?'Editar equipo':'Nuevo Tag Team / Stable',[{k:'name',l:'Nombre'},{k:'brand',l:'Marca',t:'sel',o:bopt()},{k:'m',l:'Integrantes (tocá para marcar)',t:'multi',o:S.wr.map(w=>[w.id,w.name])}],t,o=>t?Object.assign(t,o):S.tags.push({id:uid(),...o}))}
function tgDel(id){if(!confirm('¿Borrar equipo?'))return;S.tags=S.tags.filter(t=>t.id!=id);S.titles.forEach(t=>{if(t.champ==id)t.champ=''});save();render()}
const champs=()=>{const s=new Set;S.titles.forEach(t=>{if(t.champ){s.add(t.champ);S.tags.find(g=>g.id==t.champ)?.m.forEach(x=>s.add(x))}});return s};
const fsel=(k,o)=>`<select class="inp text-sm" onchange="F.${k}=this.value;rlist()">${o.map(x=>`<option value="${x[0]}" ${F[k]==x[0]?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`;
function roster(){$('#app').innerHTML=`<section class="mb-5"><div class="flex items-center justify-between mb-2"><h2 class="h text-3xl">Marcas</h2><button class="btn" onclick="brForm()">+ Marca</button></div><div class="flex flex-wrap gap-2">${S.brands.map(b=>`<span class="px-3 py-1 rounded-full text-sm font-semibold flex items-center gap-2" style="background:${b.color}33;border:1px solid ${b.color}">${esc(b.name)}<button onclick="brForm('${b.id}')">✎</button><button onclick="brDel('${b.id}')">✕</button></span>`).join('')||'<p class="text-[var(--mu)]">Sin marcas</p>'}</div></section>
<div class="flex gap-2 mb-3"><button class="btn flex-1" onclick="wrForm()">+ Luchador</button><button class="btn2 flex-1" onclick="tgForm()">+ Tag / Stable</button></div>
<div class="card p-3 mb-4 grid gap-2 grid-cols-2 sm:grid-cols-4 lg:grid-cols-7"><input class="inp text-sm col-span-2 sm:col-span-4 lg:col-span-2" placeholder="🔎 Buscar nombre, finisher, país…" value="${esc(F.q)}" oninput="F.q=this.value;rlist()">
${fsel('brand',[['','Todas las marcas'],...S.brands.map(b=>[b.id,b.name])])}${fsel('al',[['','Alineación'],['Babyface','Babyface'],['Heel','Heel'],['Tweener','Tweener']])}${fsel('w',[['','Peso'],['Heavyweight','Heavyweight'],['Cruiserweight','Cruiserweight']])}${fsel('team',[['','Equipo'],...S.tags.map(t=>[t.id,t.name])])}${fsel('letter',[['','Letra'],...[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map(l=>[l,l])])}
<label class="flex items-center gap-2 text-sm"><input type="checkbox" ${F.champ?'checked':''} onchange="F.champ=this.checked;rlist()">👑 Campeones</label></div><div id="list"></div>`;rlist()}
function rlist(){const q=F.q.toLowerCase(),ch=champs(),L=n=>!F.letter||(n||'')[0]?.toUpperCase()==F.letter;
 const ws=S.wr.filter(w=>(!q||[w.name,w.fin,w.nat].some(x=>(x||'').toLowerCase().includes(q)))&&(!F.brand||w.brand==F.brand)&&(!F.al||w.al==F.al)&&(!F.w||w.w==F.w)&&(!F.champ||ch.has(w.id))&&L(w.name)&&(!F.team||S.tags.find(t=>t.id==F.team)?.m.includes(w.id)));
 const ts=S.tags.filter(t=>(!q||t.name.toLowerCase().includes(q))&&(!F.brand||t.brand==F.brand)&&(!F.champ||ch.has(t.id))&&L(t.name)&&(!F.team||t.id==F.team)&&!F.al&&!F.w);
 const ini=n=>esc((n||'?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase());
 $('#list').innerHTML=`<h2 class="h text-3xl mb-2">Luchadores <span class="text-[var(--mu)] text-xl">${ws.length}</span></h2><div class="grid gap-3 grid-cols-[minmax(0,1fr)] sm:grid-cols-2 lg:grid-cols-3 mb-6">${ws.map(w=>`<div class="card p-3 flex gap-3 min-w-0 overflow-hidden" style="border-left:4px solid ${col(w.brand)}"><div class="w-20 h-24 shrink-0 rounded-lg relative overflow-hidden grid place-items-center h text-3xl" style="background:${col(w.brand)}33"><span>${ini(w.name)}</span><img src="${wimg(w)}" alt="" class="absolute inset-0 w-full h-full object-contain" onload="this.previousElementSibling.remove()" onerror="this.remove()"></div>
<div class="flex-1 min-w-0"><div class="flex justify-between gap-1"><b class="truncate min-w-0">${ch.has(w.id)?'👑 ':''}${esc(w.name)}</b><span class="whitespace-nowrap"><button onclick="gm('${w.id}')">🎭</button> <button onclick="wrForm('${w.id}')">✎</button> <button onclick="wrDel('${w.id}')">🗑</button></span></div>
<div class="flex flex-wrap gap-1 my-1"><span class="bd" style="background:${col(w.brand)}55">${esc(bname(w.brand))}</span><span class="bd">${esc(w.al)}</span><span class="bd">${w.w=='Cruiserweight'?'Crucero':'Heavy'}</span></div>
${gname(w)?`<p class="text-xs text-violet-400 truncate">🎭 ${esc(gname(w))}</p>`:''}${held(w.id).map(t=>`<p class="text-xs font-semibold text-amber-400 truncate">🏆 ${esc(t.name)}</p>`).join('')}<p class="text-xs text-[var(--mu)] truncate">⚡ ${esc(w.fin)||'—'} · 🌎 ${esc(w.nat)||'—'}</p><div class="h-1.5 bg-[#23232f] rounded mt-1"><div class="h-full rounded" style="width:${w.pop}%;background:${col(w.brand)}"></div></div><p class="text-xs mt-1 line-clamp-2 break-words">${esc(w.bio)}</p></div></div>`).join('')||'<p class="text-[var(--mu)]">Sin resultados.</p>'}</div>
<h2 class="h text-3xl mb-2">Tag Teams y Stables <span class="text-[var(--mu)] text-xl">${ts.length}</span></h2><div class="grid gap-3 grid-cols-[minmax(0,1fr)] sm:grid-cols-2 lg:grid-cols-3">${ts.map(t=>`<div class="card p-3" style="border-left:4px solid ${col(t.brand)}"><div class="flex justify-between"><b class="break-words min-w-0">${ch.has(t.id)?'👑 ':''}${esc(t.name)}</b><span><button onclick="tgForm('${t.id}')">✎</button> <button onclick="tgDel('${t.id}')">🗑</button></span></div><span class="bd" style="background:${col(t.brand)}55">${esc(bname(t.brand))}</span>${held(t.id).map(x=>`<p class="text-xs font-semibold text-amber-400">🏆 ${esc(x.name)}</p>`).join('')}<div class="flex flex-wrap gap-1 mt-2">${t.m.map(id=>avt(id,'w-12 h-16')).join('')}</div><p class="text-sm text-[var(--mu)] mt-1 break-words">${t.m.map(id=>esc(S.wr.find(w=>w.id==id)?.name||'?')).join(' · ')||'Sin integrantes'}</p></div>`).join('')||'<p class="text-[var(--mu)]">Sin resultados.</p>'}</div>`}
/* ---------- CAMPEONATOS ---------- */
function tiForm(id){const t=S.titles.find(x=>x.id==id);form(t?'Editar campeonato':'Nuevo campeonato',[{k:'name',l:'Nombre del título'},{k:'brand',l:'Marca',t:'sel',o:bopt()},{k:'kind',l:'Tipo',t:'sel',o:[['Individual','Individual'],['Tag Team','Tag Team']]}],t,o=>t?Object.assign(t,o):S.titles.push({id:uid(),...o,champ:'',hist:[]}))}
function tiDel(id){if(confirm('¿Borrar campeonato?')){S.titles=S.titles.filter(t=>t.id!=id);save();render()}}
const cname=id=>(S.wr.find(w=>w.id==id)||S.tags.find(t=>t.id==id))?.name;
function tiChamp(id){const t=S.titles.find(x=>x.id==id),pool=t.kind=='Tag Team'?S.tags:S.wr;
 form('Nuevo campeón · '+esc(t.name),[{k:'c',l:'Campeón',t:'sel',o:[['','Vacante'],...pool.map(x=>[x.id,x.name])]}],{c:t.champ},o=>{if(o.c==t.champ)return;if(t.champ)t.hist.unshift({n:cname(t.champ)||'?',d:new Date().toLocaleDateString('es-AR'),def:t.def||0});t.champ=o.c;t.def=0});}
function titles(){$('#app').innerHTML=`<div class="flex justify-between items-center mb-3"><h2 class="h text-3xl">Campeonatos</h2><button class="btn" onclick="tiForm()">+ Título</button></div><div class="grid gap-3 grid-cols-[minmax(0,1fr)] sm:grid-cols-2 lg:grid-cols-3">${S.titles.map(t=>`<div class="card p-4" style="border-top:4px solid ${col(t.brand)}"><div class="flex justify-between"><h3 class="h text-2xl text-amber-400">🏆 ${esc(t.name)}</h3><span><button onclick="tiForm('${t.id}')">✎</button> <button onclick="tiDel('${t.id}')">🗑</button></span></div>
<div class="flex gap-1 mb-2"><span class="bd" style="background:${col(t.brand)}55">${esc(bname(t.brand))}</span><span class="bd">${t.kind}</span></div><p class="text-xs text-[var(--mu)]">Campeón actual</p><p class="text-xl font-bold">${t.champ?esc(cname(t.champ)):'Vacante'}</p>${t.champ?`<p class="text-xs text-amber-400">🛡 ${t.def||0} defensas</p>`:''}
<button class="btn2 w-full mt-2 text-sm" onclick="tiChamp('${t.id}')">Cambiar campeón</button>

async function viaGem(turns){const key=getKey('g');if(!key)throw{code:'nokey'};
